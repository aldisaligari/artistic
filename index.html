<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>artistic — hero shader 3D</title>
<meta name="description" content="Hero experimental con degradé 3D reactivo al cursor. Práctica de shaders, geometría y motion." />
<style>
  :root{
    --c1:#52abff;
    --c2:#000000;
    --c3:#f082ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#000; overflow-x:hidden; }
  body{
    font-family:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#fff;
  }

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    min-height:560px;
    overflow:hidden;
    cursor:none;
    isolation:isolate;
  }

  .hero canvas{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
  }

  #gl{ z-index:0; }
  #fx{ z-index:2; pointer-events:none; }

  .hero-content{
    position:relative;
    z-index:3;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 24px;
    pointer-events:none;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    opacity:0.65;
    margin-bottom:18px;
    font-weight:500;
  }

  h1{
    font-size:clamp(48px, 11vw, 148px);
    line-height:0.95;
    font-weight:700;
    letter-spacing:-0.03em;
    background:linear-gradient(120deg, #ffffff 0%, #d9e9ff 45%, #ffe3fb 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 60px rgba(82,171,255,0.25);
  }

  p.sub{
    margin-top:20px;
    max-width:560px;
    font-size:clamp(14px,1.6vw,18px);
    line-height:1.55;
    opacity:0.8;
    font-weight:400;
  }

  .hint{
    position:absolute;
    bottom:34px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    opacity:0.55;
    transition:opacity 0.6s ease;
    z-index:3;
    pointer-events:none;
  }
  .hint.hidden{ opacity:0; }

  @media (max-width: 640px){
    .hero{ cursor:auto; }
    #fx{ display:none; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div class="hero-content">
    <div class="eyebrow">artistic · shader lab</div>
    <h1>ARTISTIC</h1>
    <p class="sub">Un playground de degradés, geometría y motion. La superficie es 3D de verdad: se deforma y gira con el cursor.</p>
  </div>

  <div class="hint" id="hint">mové el cursor</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================================
     FONDO 3D REAL — Three.js
     Un PlaneGeometry subdividido cuyos vértices se desplazan en Z
     con ruido (fbm), iluminado con luz difusa + especular + fresnel,
     y filmado con una cámara en perspectiva real (hay profundidad
     de verdad, no un truco de sombreado sobre una superficie plana).
     Parámetros de referencia del ShaderGradient original:
     color1 #52abff · color2 #000000 · color3 #f082ff
     brightness .6 · uSpeed 1.3 · uStrength 7.5
     uFrequency 5.5 · uDensity 3.6 · uAmplitude 1
     rotationY 10° · rotationZ 50° · fov 45 · cDistance 3.61
  ============================================================ */

  var glCanvas = document.getElementById('gl');

  var VERT = [
    "uniform float u_time;",
    "uniform vec2 u_mouse;",
    "uniform float u_speed;",
    "uniform float u_strength;",
    "uniform float u_frequency;",
    "uniform float u_density;",
    "uniform float u_amplitude;",
    "uniform float u_hover;",

    "varying vec3 vNormal;",
    "varying vec3 vViewPosition;",
    "varying float vHeight;",

    "vec3 mod289v3(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }",
    "vec2 mod289v2(vec2 x){ return x - floor(x*(1.0/289.0))*289.0; }",
    "vec3 permute(vec3 x){ return mod289v3(((x*34.0)+1.0)*x); }",

    "float snoise(vec2 v){",
    "  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);",
    "  vec2 i  = floor(v + dot(v, C.yy));",
    "  vec2 x0 = v - i + dot(i, C.xx);",
    "  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);",
    "  vec4 x12 = x0.xyxy + C.xxzz;",
    "  x12.xy -= i1;",
    "  i = mod289v2(i);",
    "  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));",
    "  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);",
    "  m = m*m; m = m*m;",
    "  vec3 x = 2.0 * fract(p * C.www) - 1.0;",
    "  vec3 h = abs(x) - 0.5;",
    "  vec3 ox = floor(x + 0.5);",
    "  vec3 a0 = x - ox;",
    "  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);",
    "  vec3 g;",
    "  g.x  = a0.x  * x0.x  + h.x  * x0.y;",
    "  g.yz = a0.yz * x12.xz + h.yz * x12.yw;",
    "  return 130.0 * dot(m, g);",
    "}",

    "float fbm5(vec2 p){",
    "  float value = 0.0; float amp = 0.5;",
    "  for(int i=0;i<5;i++){ value += amp*snoise(p); p *= 2.0; amp *= 0.5; }",
    "  return value;",
    "}",
    "float fbm3(vec2 p){",
    "  float value = 0.0; float amp = 0.5;",
    "  for(int i=0;i<3;i++){ value += amp*snoise(p); p *= 2.0; amp *= 0.5; }",
    "  return value;",
    "}",

    "float heightAt(vec2 p, float t, vec2 mouseP, float pull, bool cheap){",
    "  vec2 warped = p + mouseP*0.35*u_hover;",
    "  warped += pull * normalize(p - mouseP + 0.0001) * 0.25;",
    "  float n;",
    "  if(cheap){",
    "    n = fbm3(warped*u_frequency*0.55 + vec2(t, -t*0.7));",
    "    n += fbm3(warped*u_density*0.85 - vec2(t*0.5, t*0.3)) * 0.5;",
    "  } else {",
    "    n = fbm5(warped*u_frequency*0.55 + vec2(t, -t*0.7));",
    "    n += fbm5(warped*u_density*0.85 - vec2(t*0.5, t*0.3)) * 0.5;",
    "  }",
    "  n *= (u_amplitude*0.6 + u_strength*0.05);",
    "  n += pull*1.4;",
    "  return n;",
    "}",

    "void main(){",
    "  vec2 p = uv - 0.5;",
    "  vec2 mouseP = u_mouse - 0.5;",
    "  float distToMouse = length(p - mouseP);",
    "  float pull = exp(-distToMouse*2.2) * u_hover;",
    "  float t = u_time * u_speed * 0.15;",

    "  float h = heightAt(p, t, mouseP, pull, false);",

    "  float eps = 0.01;",
    "  float hL = heightAt(p - vec2(eps,0.0), t, mouseP, pull, true);",
    "  float hR = heightAt(p + vec2(eps,0.0), t, mouseP, pull, true);",
    "  float hD = heightAt(p - vec2(0.0,eps), t, mouseP, pull, true);",
    "  float hU = heightAt(p + vec2(0.0,eps), t, mouseP, pull, true);",

    "  vec3 localNormal = normalize(vec3((hL-hR)*4.2, (hD-hU)*4.2, 1.0));",
    "  vec3 displaced = position + normal * h * 0.95;",

    "  vNormal = normalize(normalMatrix * localNormal);",
    "  vHeight = h;",

    "  vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);",
    "  vViewPosition = -mvPosition.xyz;",
    "  gl_Position = projectionMatrix * mvPosition;",
    "}"
  ].join("\n");

  var FRAG = [
    "precision highp float;",
    "uniform vec3 u_color1;",
    "uniform vec3 u_color2;",
    "uniform vec3 u_color3;",
    "uniform float u_brightness;",

    "varying vec3 vNormal;",
    "varying vec3 vViewPosition;",
    "varying float vHeight;",

    "void main(){",
    "  vec3 nrm = normalize(vNormal);",
    "  vec3 viewDir = normalize(vViewPosition);",
    "  vec3 lightDir = normalize(vec3(0.35, 0.55, 0.75));",

    "  float diff = max(dot(nrm, lightDir), 0.0);",
    "  vec3 halfDir = normalize(lightDir + viewDir);",
    "  float spec = pow(max(dot(nrm, halfDir), 0.0), 26.0);",
    "  float fresnel = pow(1.0 - max(dot(viewDir, nrm), 0.0), 3.0);",

    "  float g = clamp(vHeight*0.5+0.5, 0.0, 1.0);",
    "  g = clamp((g-0.5)*1.35+0.5, 0.0, 1.0);",

    "  vec3 col = mix(u_color1, u_color2, smoothstep(0.36, 0.46, g));",
    "  col = mix(col, u_color3, smoothstep(0.75, 0.83, g));",

    "  col *= (0.48 + diff*0.78);",
    "  col += spec * 0.5 * mix(vec3(1.0), u_color3, 0.35);",
    "  col += fresnel * 0.16 * u_color1;",

    "  col *= u_brightness * 1.6;",

    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  function hexToRgb(hex){
    var v = parseInt(hex.replace('#',''), 16);
    return [((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255];
  }

  var renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 3.61);
  camera.lookAt(0, 0, 0);

  var group = new THREE.Group();
  scene.add(group);

  var geometry = new THREE.PlaneGeometry(9, 9, 140, 140);

  var c1 = hexToRgb('#52abff');
  var c2 = hexToRgb('#000000');
  var c3 = hexToRgb('#f082ff');

  var uniforms = {
    u_time: { value: 0 },
    u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
    u_speed: { value: 1.3 },
    u_strength: { value: 7.5 },
    u_frequency: { value: 5.5 },
    u_density: { value: 3.6 },
    u_amplitude: { value: 1.0 },
    u_brightness: { value: 0.6 },
    u_hover: { value: reducedMotion ? 0.15 : 0.28 },
    u_color1: { value: new THREE.Vector3(c1[0], c1[1], c1[2]) },
    u_color2: { value: new THREE.Vector3(c2[0], c2[1], c2[2]) },
    u_color3: { value: new THREE.Vector3(c3[0], c3[1], c3[2]) }
  };

  var material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: VERT,
    fragmentShader: FRAG,
    side: THREE.DoubleSide
  });

  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.x = -1.3;
  mesh.rotation.set(0, 10 * Math.PI/180, 50 * Math.PI/180);
  group.add(mesh);

  function resize(){
    var w = glCanvas.clientWidth, h = glCanvas.clientHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var mouseNorm = [0.5, 0.5];
  var targetHover = reducedMotion ? 0.15 : 0.28;
  var hoverVal = targetHover;
  var targetTiltX = 0, targetTiltY = 0, tiltX = 0, tiltY = 0;

  var clock = new THREE.Clock();
  function animate(){
    var t = clock.getElapsedTime();

    hoverVal += (targetHover - hoverVal) * 0.06;
    tiltX += (targetTiltX - tiltX) * 0.09;
    tiltY += (targetTiltY - tiltY) * 0.09;

    var idleX = reducedMotion ? 0 : Math.sin(t * 0.22) * 0.06;
    var idleY = reducedMotion ? 0 : Math.cos(t * 0.16) * 0.09;

    group.rotation.x = tiltX + idleX;
    group.rotation.y = tiltY + idleY;

    uniforms.u_time.value = t;
    uniforms.u_mouse.value.set(mouseNorm[0], mouseNorm[1]);
    uniforms.u_hover.value = hoverVal;

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  /* ============================================================
     CURSOR CUSTOM + PARTÍCULAS "VOLCÁN"
  ============================================================ */

  var hero = document.getElementById('hero');
  var fx = document.getElementById('fx');
  var ctx = fx.getContext('2d');
  var hint = document.getElementById('hint');

  var dpr2 = Math.min(window.devicePixelRatio || 1, 2);
  function resizeFx(){
    fx.width = fx.clientWidth * dpr2;
    fx.height = fx.clientHeight * dpr2;
    ctx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
  }
  window.addEventListener('resize', resizeFx);
  resizeFx();

  var pointer = { x: fx.clientWidth/2, y: fx.clientHeight/2, active:false };
  var lastPointer = { x: pointer.x, y: pointer.y };
  var particles = [];
  var MAX_PARTICLES = 240;

  function spawnParticles(x, y, count, speedBoost){
    for(var i=0;i<count;i++){
      if(particles.length >= MAX_PARTICLES) particles.shift();
      var angle = -Math.PI/2 + (Math.random()-0.5)*1.5;
      var spd = (1 + Math.random()*2.6) * (1 + speedBoost*0.18);
      var tinted = Math.random() < 0.16;
      particles.push({
        x:x, y:y,
        vx: Math.cos(angle)*spd + (Math.random()-0.5)*0.6,
        vy: Math.sin(angle)*spd,
        life: 1,
        decay: 0.018 + Math.random()*0.02,
        size: 1.2 + Math.random()*2.2,
        color: tinted ? (Math.random()<0.5 ? '82,171,255' : '240,130,255') : '255,255,255'
      });
    }
  }

  function updateParticles(){
    ctx.clearRect(0, 0, fx.clientWidth, fx.clientHeight);

    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(pointer.x, pointer.y, 7, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var i=particles.length-1; i>=0; i--){
      var p = particles[i];
      p.vy += 0.045;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(p.size*p.life, 0.2), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(' + p.color + ',' + (p.life*0.9) + ')';
      ctx.fill();
    }
    ctx.restore();

    requestAnimationFrame(updateParticles);
  }
  requestAnimationFrame(updateParticles);

  var idleSpawnAcc = 0;
  function frameTick(){
    idleSpawnAcc++;
    if(!reducedMotion && pointer.active && idleSpawnAcc % 2 === 0){
      spawnParticles(pointer.x, pointer.y, 1, 0);
    }
    requestAnimationFrame(frameTick);
  }
  requestAnimationFrame(frameTick);

  function onMove(clientX, clientY){
    var rect = hero.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;

    var dx = x - lastPointer.x;
    var dy = y - lastPointer.y;
    var dist = Math.sqrt(dx*dx + dy*dy);

    pointer.x = x; pointer.y = y; pointer.active = true;
    mouseNorm[0] = x / rect.width;
    mouseNorm[1] = 1 - (y / rect.height);
    targetHover = 1;

    if(!reducedMotion){
      targetTiltY = ((x/rect.width) - 0.5) * 0.62;
      targetTiltX = ((y/rect.height) - 0.5) * -0.42;
      spawnParticles(x, y, Math.min(6, 2 + dist*0.15), dist);
    }

    lastPointer.x = x; lastPointer.y = y;

    if(hint && !hint.classList.contains('hidden')){
      hint.classList.add('hidden');
    }
  }

  hero.addEventListener('mousemove', function(e){ onMove(e.clientX, e.clientY); });
  hero.addEventListener('mouseleave', function(){
    pointer.active = false;
    targetHover = reducedMotion ? 0.15 : 0.28;
    targetTiltX = 0;
    targetTiltY = 0;
  });
  hero.addEventListener('touchmove', function(e){
    if(e.touches && e.touches[0]){
      onMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive:true });

})();
</script>

</body>
</html>
